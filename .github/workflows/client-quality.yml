name: Client Quality Gates

on:
  workflow_call:
    inputs:
      ref:
        description: "Commit or tag to check out"
        required: false
        type: string

permissions:
  contents: read

jobs:
  contracts:
    name: API and State Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.18
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install mobile workspace dependencies
        working-directory: apps/mobile
        run: bun install --frozen-lockfile
      - name: Link mobile node_modules for workspace package resolution
        run: |
          ln -sfn "$GITHUB_WORKSPACE/apps/mobile/node_modules" "$GITHUB_WORKSPACE/node_modules"
      - name: Test API streaming and error contracts
        run: bun test packages/api/test
      - name: Test mobile navigation and workspace contracts
        run: |
          bun test ./tests/mobile-first-send-workspace.test.ts
          bun test ./tests/mobile-target-branch-continuation.test.ts
          bun test ./tests/mobile-navigation-shell.test.ts
      - name: Test mobile behavior and compatibility contracts
        run: deno task test:mobile
      - name: Type-check shared client state
        run: deno task check:state
      - name: Test shared client state contracts
        run: deno task test:state

  mobile-web-export:
    name: Mobile Web Export
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.18
      - run: bun install --frozen-lockfile
      - name: Type-check mobile interactions
        run: npx tsc --noEmit
      - run: npx expo export --platform web
