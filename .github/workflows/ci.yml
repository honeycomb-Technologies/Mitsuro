name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  canonical-identity:
    name: Canonical Identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Check canonical names and exact compatibility exceptions
        run: bash scripts/check-canonical-names.sh
      - name: Check product marketing versions stay aligned
        run: sh scripts/check-product-version.sh
      - name: Check workspace Cargo.lock versions stay aligned
        run: sh scripts/refresh-workspace-lock-versions.sh --check
      - name: Exercise installer migration and rollback fixtures
        run: sh install.sh --self-test

  start-missing-release:
    name: Start missing binary release
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: canonical-identity
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Start Release binaries when this version is tagged but unpublished
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' crates/mitsuro-cli/Cargo.toml | head -n 1)
          tag="v${version}"
          if [ -z "$version" ]; then
            echo "Could not read cargo/mitsuro version" >&2
            exit 1
          fi
          if ! git rev-parse --verify "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "No ${tag} tag in this history; skip"
            exit 0
          fi
          sh scripts/start-binary-release.sh "$tag"

  client-quality:
    name: Client Quality Gates
    needs: canonical-identity
    uses: ./.github/workflows/client-quality.yml

  mobile-web-export:
    name: Mobile Web Export
    needs: client-quality
    runs-on: ubuntu-latest
    steps:
      - name: Surface the required status-check name
        run: echo "Client Quality Gates / Mobile Web Export already passed"

  rust-check:
    name: Rust Check
    needs: canonical-identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libudev-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - run: cargo check --workspace

  windows-check:
    name: Windows Check
    needs: canonical-identity
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - run: cargo check --locked --target x86_64-pc-windows-msvc -p mitsuro

  rust-test:
    name: Rust Test
    needs: canonical-identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libudev-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            ripgrep \
            bubblewrap
      - name: Allow bubblewrap user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
          fi
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - run: cargo test --workspace

  rust-clippy:
    name: Rust Clippy
    needs: canonical-identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libudev-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy
      - run: cargo clippy --workspace -- -D warnings

  rust-format:
    name: Rust Format
    needs: canonical-identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  desktop-canvas-packaging:
    name: Canvas Linux Packaging Contracts
    needs: canonical-identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install metadata validators
        run: sudo apt-get update && sudo apt-get install -y desktop-file-utils appstream jq
      - name: Validate Canvas package metadata and deterministic staging
        run: apps/desktop/canvas/packaging/test-package-linux-alpha.sh
      - name: Test Canvas release asset validation
        run: python3 -m unittest scripts/test_check_canvas_release.py scripts/test_interface_versions.py
