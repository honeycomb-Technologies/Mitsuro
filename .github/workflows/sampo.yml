name: Version (Sampo)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  sampo:
    name: Release or publish
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.sampo.outputs.released }}
      published: ${{ steps.sampo.outputs.published }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run Sampo
        id: sampo
        uses: bruits/sampo/crates/sampo-github-action@cargo-sampo-github-action-v0.18.0
        with:
          command: auto
          create-github-release: false
          pr-branch: release/sampo
          pr-title: Release (Sampo)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Finish Release PR branch
        if: always() && steps.sampo.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git ls-remote --exit-code origin release/sampo >/dev/null; then
            echo "No release/sampo branch to finish"
            exit 0
          fi
          git fetch origin release/sampo
          git checkout release/sampo
          sh scripts/refresh-workspace-lock-versions.sh origin/main
          sh scripts/sync-product-version.sh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- Cargo.lock apps/mobile/app.json apps/mobile/package.json apps/desktop/canvas/packaging/io.mitsuro.canvas.metainfo.xml; then
            git add Cargo.lock apps/mobile/app.json apps/mobile/package.json apps/desktop/canvas/packaging/io.mitsuro.canvas.metainfo.xml
            git commit -m "chore(release): keep Cargo.lock pins and sync interface versions"
            git push origin release/sampo
          fi
          if ! gh pr list --repo "$GITHUB_REPOSITORY" --head release/sampo --base main --state open --json number --jq 'length | tostring' | grep -qx 0; then
            echo "Release PR already open"
            exit 0
          fi
          if ! gh pr create --repo "$GITHUB_REPOSITORY" --base main --head release/sampo \
            --title "Version (Sampo)" \
            --body "Sampo version bump, lockfile pins, and Expo sync. Merging tags and starts Release binaries."; then
            echo "Could not open the Version PR with GITHUB_TOKEN." >&2
            echo "Enable: Settings → Actions → General → Allow GitHub Actions to create and approve pull requests." >&2
            echo "Or open https://github.com/${GITHUB_REPOSITORY}/compare/main...release/sampo" >&2
            exit 1
          fi

      - name: Start binary release for the new v* tag
        if: steps.sampo.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' crates/mitsuro-cli/Cargo.toml | head -n 1)
          if [ -z "$version" ]; then
            echo "Could not read cargo/mitsuro version" >&2
            exit 1
          fi
          sh scripts/start-binary-release.sh "v${version}"
