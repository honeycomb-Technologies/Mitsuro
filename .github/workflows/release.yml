name: Release binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Protected v* tag to build and publish"
        required: true
        type: string

concurrency:
  group: release-binaries-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

permissions:
  contents: read

jobs:
  release-authority:
    name: Verify release authority
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag_commit: ${{ steps.authority.outputs.tag_commit }}
    steps:
      - name: Require a protected main-derived release tag
        id: authority
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          REF_PROTECTED: ${{ github.ref_protected }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:-}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must look like v0.9.23, got: ${tag:-<empty>}" >&2
            exit 1
          fi

          case "$EVENT_NAME" in
            push)
              if [[ "$REF_TYPE" != tag || "$REF_NAME" != "$tag" || "$REF" != "refs/tags/$tag" || "$REF_PROTECTED" != true ]]; then
                echo "Tag pushes must originate from the exact protected release tag." >&2
                exit 1
              fi
              ;;
            workflow_dispatch)
              if [[ "$REF" != refs/heads/main || "$REF_PROTECTED" != true ]]; then
                echo "Manual release dispatch must run from protected main." >&2
                exit 1
              fi
              ;;
            *)
              echo "Unsupported release event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac

          tag_commit=$(gh api "repos/${GITHUB_REPOSITORY}/commits/$tag" --jq .sha)
          main_commit=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)

          if [[ ! "$tag_commit" =~ ^[0-9a-f]{40}$ || ! "$main_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Release authority returned a malformed commit identity." >&2
            exit 1
          fi

          if ! gh api "repos/${GITHUB_REPOSITORY}/contents/apps/desktop/canvas/Cargo.toml?ref=$tag_commit" --silent; then
            echo "This tag predates Native Canvas. Existing releases remain immutable; use the original release tooling under a separate recovery approval." >&2
            exit 1
          fi

          comparison=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${tag_commit}...${main_commit}")
          comparison_status=$(jq -er .status <<<"$comparison")
          base_commit=$(jq -er .base_commit.sha <<<"$comparison")
          merge_base=$(jq -er .merge_base_commit.sha <<<"$comparison")

          case "$comparison_status" in
            ahead|identical) ;;
            *)
              echo "Release tag $tag is not contained in protected main." >&2
              exit 1
              ;;
          esac
          if [[ "$base_commit" != "$tag_commit" || "$merge_base" != "$tag_commit" ]]; then
            echo "Release tag $tag is not contained in protected main." >&2
            exit 1
          fi

          echo "tag_commit=$tag_commit" >> "$GITHUB_OUTPUT"

  canonical-identity:
    name: Canonical Identity
    needs: release-authority
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ needs.release-authority.outputs.tag_commit }}
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Check canonical names and exact compatibility exceptions
        run: bash scripts/check-canonical-names.sh
      - name: Exercise installer migration and rollback fixtures
        run: sh install.sh --self-test

  client-quality:
    name: Client Quality Gates
    needs: [release-authority, canonical-identity]
    uses: ./.github/workflows/client-quality.yml
    with:
      ref: ${{ needs.release-authority.outputs.tag_commit }}

  build:
    name: Build ${{ matrix.target }}
    needs: [release-authority, client-quality]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ needs.release-authority.outputs.tag_commit }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - name: Install Bun
        run: npm install -g bun

      - name: Install mobile web dependencies
        working-directory: apps/mobile
        run: bun install --frozen-lockfile

      - name: Build mobile web frontend
        working-directory: apps/mobile
        run: npx expo export --platform web

      - name: Stage pinned Atlas runtime (Unix)
        if: matrix.os != 'windows-latest'
        run: sh scripts/install-atlas-runtime.sh

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build (Unix)
        if: matrix.os != 'windows-latest'
        run: cargo build --release --locked --target ${{ matrix.target }} -p mitsuro -p mitsuro-hive

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: cargo build --release --locked --target ${{ matrix.target }} -p mitsuro

      - name: Verify compatibility command forwarding (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          release_dir="target/${{ matrix.target }}/release"
          test "$("$release_dir/mitsuro" --version)" = "$("$release_dir/krusty" --version)"
          test "$("$release_dir/mitsuro-hive" --version)" = "$("$release_dir/krusty-mako" --version)"

      - name: Verify compatibility command forwarding (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          release_dir="target/${{ matrix.target }}/release"
          test "$("$release_dir/mitsuro.exe" --version)" = "$("$release_dir/krusty.exe" --version)"

      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          package_dir="mitsuro-${{ matrix.target }}"
          mkdir -p "$package_dir/systemd"
          cp "target/${{ matrix.target }}/release/mitsuro" "$package_dir/"
          cp "target/${{ matrix.target }}/release/mitsuro-hive" "$package_dir/"
          cp "target/${{ matrix.target }}/release/krusty" "$package_dir/"
          cp "target/${{ matrix.target }}/release/krusty-mako" "$package_dir/"
          cp target/atlas/agent-browser "$package_dir/"
          cp deploy/systemd/mitsuro-hive.service "$package_dir/systemd/"
          cp deploy/systemd/mitsuro-hive.socket "$package_dir/systemd/"
          cp deploy/systemd/mitsuro-serve.service "$package_dir/systemd/"
          tar czf "mitsuro-${{ matrix.target }}.tar.gz" -C "$package_dir" .
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum mitsuro-${{ matrix.target }}.tar.gz > mitsuro-${{ matrix.target }}.tar.gz.sha256
          else
            shasum -a 256 mitsuro-${{ matrix.target }}.tar.gz > mitsuro-${{ matrix.target }}.tar.gz.sha256
          fi

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../mitsuro-${{ matrix.target }}.zip mitsuro.exe
          # The old Windows updater extracts only krusty.exe. Give it the full
          # canonical binary, not the thin forwarder that needs mitsuro.exe.
          cp mitsuro.exe krusty.exe
          cmp -s mitsuro.exe krusty.exe
          7z a ../../../krusty-${{ matrix.target }}.zip krusty.exe
          cd ../../..
          # Force text-mode manifests (two spaces). Some Windows/Git-Bash
          # sha256sum builds emit binary-mode "hash *name", which breaks the
          # release validator that expects the portable text form.
          for archive in \
            "mitsuro-${{ matrix.target }}.zip" \
            "krusty-${{ matrix.target }}.zip"; do
            digest=$(sha256sum "$archive" | awk "{ print \$1 }")
            printf "%s  %s\n" "$digest" "$archive" > "${archive}.sha256"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mitsuro-${{ matrix.target }}
          path: |
            mitsuro-${{ matrix.target }}.*
            krusty-${{ matrix.target }}.*

  desktop-linux:
    name: Build Native Canvas Linux Archive
    needs: [release-authority, client-quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ needs.release-authority.outputs.tag_commit }}

      - name: Install Canvas build and metadata dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libudev-dev libgtk-3-dev libxcb1-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libfontconfig1-dev libssl-dev \
            pkg-config desktop-file-utils appstream jq
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.18
      - name: Build the companion web surface
        working-directory: apps/mobile
        run: |
          bun install --frozen-lockfile
          bunx expo export --platform web
      - name: Test Canvas contracts and packaging
        run: |
          cargo test --locked -p mitsuro-canvas
          apps/desktop/canvas/packaging/test-package-linux-alpha.sh
          python3 -m unittest scripts/test_check_canvas_release.py scripts/test_interface_versions.py
      - name: Build Native Canvas and server companion
        env:
          MITSURO_CANVAS_SOURCE_COMMIT: ${{ needs.release-authority.outputs.tag_commit }}
        run: cargo build --release --locked -p mitsuro-canvas -p mitsuro
      - name: Package the exact Canvas source
        run: |
          apps/desktop/canvas/packaging/package-linux-alpha.sh \
            --canvas-bin "$PWD/target/release/mitsuro-canvas" \
            --server-bin "$PWD/target/release/mitsuro" \
            --output-dir "$PWD/artifacts/canvas"
          python3 scripts/check-canvas-release.py artifacts/canvas "${RELEASE_TAG#v}" "$(git rev-parse HEAD)"
      - name: Upload Canvas Linux archive and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mitsuro-canvas-linux
          if-no-files-found: error
          path: |
            artifacts/canvas/*.tar.gz
            artifacts/canvas/*.tar.gz.sha256

  release:
    name: Create Release
    needs: [release-authority, build, desktop-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Reconfirm the authorized release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_TAG_COMMIT: ${{ needs.release-authority.outputs.tag_commit }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:-}"
          current_tag_commit=$(gh api "repos/${GITHUB_REPOSITORY}/commits/$tag" --jq .sha)
          if [[ "$current_tag_commit" != "$EXPECTED_TAG_COMMIT" ]]; then
            echo "Release tag authority changed after the build gate." >&2
            exit 1
          fi

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          ref: ${{ needs.release-authority.outputs.tag_commit }}

      - name: Download all artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir artifacts

      - name: Validate Windows updater bridge
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t unexpected_unix_aliases < <(
            find artifacts -type f -name 'krusty-*.tar.gz*' -print
          )
          if [[ "${#unexpected_unix_aliases[@]}" -ne 0 ]]; then
            printf 'Unix compatibility archives are not reachable by the old updater:\n' >&2
            printf '  %s\n' "${unexpected_unix_aliases[@]}" >&2
            exit 1
          fi

          canonical_name=mitsuro-x86_64-pc-windows-msvc.zip
          compatibility_name=krusty-x86_64-pc-windows-msvc.zip
          mapfile -t canonical_matches < <(find artifacts -type f -name "$canonical_name" -print)
          mapfile -t compatibility_matches < <(find artifacts -type f -name "$compatibility_name" -print)
          test "${#canonical_matches[@]}" -eq 1
          test "${#compatibility_matches[@]}" -eq 1

          validate_manifest() {
            archive_path=$1
            archive_name=$2
            manifest_path="$archive_path.sha256"
            test -f "$manifest_path"
            test "$(awk 'NF { count++ } END { print count + 0 }' "$manifest_path")" -eq 1
            # Accept GNU text ("hash  name") and binary ("hash *name") forms.
            grep -Eq "^[0-9a-f]{64}(  | \\*)$archive_name$" "$manifest_path"
            expected_digest=$(awk 'NF { print $1; exit }' "$manifest_path")
            actual_digest=$(sha256sum "$archive_path" | awk '{ print $1 }')
            test "$expected_digest" = "$actual_digest"
          }
          validate_manifest "${canonical_matches[0]}" "$canonical_name"
          validate_manifest "${compatibility_matches[0]}" "$compatibility_name"

          python - \
            "${canonical_matches[0]}" mitsuro.exe \
            "${compatibility_matches[0]}" krusty.exe <<'PY'
          import hashlib
          import stat
          import sys
          import zipfile

          maximum_bytes = 512 * 1024 * 1024

          def exact_payload_digest(archive_path: str, expected_name: str) -> str:
              with zipfile.ZipFile(archive_path) as archive:
                  entries = archive.infolist()
                  if len(entries) != 1:
                      raise SystemExit(
                          f"{archive_path}: expected one {expected_name} entry, found {len(entries)}"
                      )
                  entry = entries[0]
                  if entry.filename != expected_name or entry.is_dir():
                      raise SystemExit(
                          f"{archive_path}: entry must be exactly the file {expected_name}"
                      )
                  unix_mode = (entry.external_attr >> 16) & 0xFFFF
                  if unix_mode and stat.S_IFMT(unix_mode) not in (0, stat.S_IFREG):
                      raise SystemExit(f"{archive_path}: unsupported ZIP entry type")
                  if entry.file_size > maximum_bytes:
                      raise SystemExit(f"{archive_path}: extracted binary is too large")

                  digest = hashlib.sha256()
                  copied = 0
                  with archive.open(entry) as payload:
                      while chunk := payload.read(1024 * 1024):
                          copied += len(chunk)
                          if copied > maximum_bytes:
                              raise SystemExit(f"{archive_path}: extracted binary is too large")
                          digest.update(chunk)
                  return digest.hexdigest()

          canonical_digest = exact_payload_digest(sys.argv[1], sys.argv[2])
          compatibility_digest = exact_payload_digest(sys.argv[3], sys.argv[4])
          if canonical_digest != compatibility_digest:
              raise SystemExit("Windows canonical and compatibility payloads differ")
          PY

      - name: Render and validate Homebrew formula
        env:
          TAG_NAME: ${{ env.RELEASE_TAG }}
        run: |
          bash .github/homebrew/render-formula.sh \
            "$TAG_NAME" \
            artifacts \
            artifacts/homebrew/mitsuro.rb

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ env.RELEASE_TAG }}
        run: |
          mapfile -t release_assets < <(find artifacts -type f -print | sort)
          if [ "${#release_assets[@]}" -eq 0 ]; then
            echo "No release assets found" >&2
            exit 1
          fi

          declare -A expected_by_name=()
          canvas_archive=$(python3 scripts/check-canvas-release.py artifacts "${TAG_NAME#v}" "$(git rev-parse HEAD)")
          for asset in "${release_assets[@]}"; do
            asset_name=${asset##*/}
            if [[ -n "${expected_by_name[$asset_name]+present}" ]]; then
              echo "Release assets contain duplicate basename: $asset_name" >&2
              exit 1
            fi
            expected_by_name[$asset_name]=$asset
            case "$asset_name" in
              mitsuro-aarch64-apple-darwin.tar.gz | \
              mitsuro-aarch64-apple-darwin.tar.gz.sha256 | \
              mitsuro-x86_64-apple-darwin.tar.gz | \
              mitsuro-x86_64-apple-darwin.tar.gz.sha256 | \
              mitsuro-aarch64-unknown-linux-gnu.tar.gz | \
              mitsuro-aarch64-unknown-linux-gnu.tar.gz.sha256 | \
              mitsuro-x86_64-unknown-linux-gnu.tar.gz | \
              mitsuro-x86_64-unknown-linux-gnu.tar.gz.sha256 | \
              mitsuro-x86_64-pc-windows-msvc.zip | \
              mitsuro-x86_64-pc-windows-msvc.zip.sha256 | \
              krusty-x86_64-pc-windows-msvc.zip | \
              krusty-x86_64-pc-windows-msvc.zip.sha256 | \
              mitsuro.rb)
                ;;
              "$canvas_archive" | "$canvas_archive.sha256")
                ;;
              *)
                echo "Unexpected release asset: $asset_name" >&2
                exit 1
                ;;
            esac
          done

          required_assets=(
            mitsuro-aarch64-apple-darwin.tar.gz
            mitsuro-aarch64-apple-darwin.tar.gz.sha256
            mitsuro-x86_64-apple-darwin.tar.gz
            mitsuro-x86_64-apple-darwin.tar.gz.sha256
            mitsuro-aarch64-unknown-linux-gnu.tar.gz
            mitsuro-aarch64-unknown-linux-gnu.tar.gz.sha256
            mitsuro-x86_64-unknown-linux-gnu.tar.gz
            mitsuro-x86_64-unknown-linux-gnu.tar.gz.sha256
            mitsuro-x86_64-pc-windows-msvc.zip
            mitsuro-x86_64-pc-windows-msvc.zip.sha256
            krusty-x86_64-pc-windows-msvc.zip
            krusty-x86_64-pc-windows-msvc.zip.sha256
            mitsuro.rb
            "$canvas_archive"
            "$canvas_archive.sha256"
          )
          for asset_name in "${required_assets[@]}"; do
            if [[ -z "${expected_by_name[$asset_name]+present}" ]]; then
              echo "Required release asset is missing: $asset_name" >&2
              exit 1
            fi
          done

          notes_file=$(mktemp)
          changelog=crates/mitsuro-cli/CHANGELOG.md
          if [[ -f "$changelog" ]]; then
            awk '/^## /{ if (seen++) exit } { print }' "$changelog" > "$notes_file"
          fi
          if [[ ! -s "$notes_file" ]]; then
            notes_file=""
          fi

          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            existing_dir=$(mktemp -d)
            trap 'rm -rf -- "$existing_dir"' EXIT
            gh release download "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --dir "$existing_dir" || true
            mapfile -t existing_assets < <(find "$existing_dir" -type f -print | sort)
            declare -A existing_by_name=()
            for asset in "${existing_assets[@]}"; do
              asset_name=${asset##*/}
              if [[ -n "${existing_by_name[$asset_name]+present}" ]]; then
                echo "Existing release contains duplicate basename: $asset_name" >&2
                exit 1
              fi
              existing_by_name[$asset_name]=$asset
            done

            missing_assets=()
            for asset in "${release_assets[@]}"; do
              asset_name=${asset##*/}
              if [[ -z "${existing_by_name[$asset_name]+present}" ]]; then
                missing_assets+=("$asset")
                continue
              fi
              if ! cmp -s "$asset" "${existing_by_name[$asset_name]}"; then
                echo "Existing release asset differs and will not be replaced: $asset_name" >&2
                exit 1
              fi
            done
            if [[ "${#missing_assets[@]}" -gt 0 ]]; then
              gh release upload "$TAG_NAME" "${missing_assets[@]}" --repo "$GITHUB_REPOSITORY"
              echo "Uploaded ${#missing_assets[@]} missing assets to $TAG_NAME"
            else
              echo "Existing release assets are byte-identical; no upload required."
            fi
          elif [[ -n "$notes_file" ]]; then
            gh release create "$TAG_NAME" "${release_assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG_NAME" \
              --notes-file "$notes_file"
          else
            gh release create "$TAG_NAME" "${release_assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG_NAME" \
              --generate-notes
          fi
          echo "Released ${TAG_NAME}. Honey: sh scripts/honey-upgrade.sh ${TAG_NAME}"
