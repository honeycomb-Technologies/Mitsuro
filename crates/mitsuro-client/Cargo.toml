[package]
name = "mitsuro-client"
version = "0.10.1"
publish = false
edition = "2021"
description = "Async Rust client for the Mitsuro server API"

[dependencies]
anyhow = "1.0"
async-stream = "0.3"
base64ct = { version = "1", features = ["alloc"] }
bytes = "1"
futures-core = "0.3"
futures-util = "0.3"
http = "1"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
  "stream",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["sync"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect"] }

[dev-dependencies]
tokio = { version = "1.40", features = ["macros", "rt"] }

[lints]
workspace = true
