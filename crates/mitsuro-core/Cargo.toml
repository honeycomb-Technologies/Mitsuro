[package]
name = "mitsuro-core"
version = "0.10.1"
publish = false
edition = "2021"
description = "Core library for Mitsuro - AI, storage, tools, and extensions"

[dependencies]
# Async Runtime
tokio = { version = "1.40", features = ["full"] }

# Error Handling
anyhow = "1.0"
thiserror = "2.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"

# Logging
tracing = "0.1"

# Async Utilities
async-trait = "0.1"
futures = "0.3"
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["compat"] }

# HTTP (rustls for cross-platform TLS without OpenSSL)
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "stream",
  "rustls-tls",
] }
# rmcp 1.3 uses reqwest 0.13 for its OAuth authorization manager. Keep the
# alias explicit so the manager can receive a client with Mitsuro's timeout and
# redirect policy instead of silently falling back to SDK defaults.
reqwest_rmcp = { package = "reqwest", version = "0.13.2", default-features = false, features = [
  "json",
  "stream",
  "rustls-no-provider",
] }
# reqwest 0.13's `rustls-no-provider` feature deliberately leaves process-wide
# provider selection to the application. Reuse Mitsuro's existing ring backend.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = [
  "rustls-tls-webpki-roots",
  "connect",
] }

# Image processing (for tool screenshots)
image = { version = "0.25", default-features = false, features = ["png"] }

# Database (SQLite for local storage)
rusqlite = { version = "0.32", features = ["backup", "bundled"] }

# WASM Extensions (Zed compatibility)
wasmtime = { version = "29", default-features = false, features = [
  "async",
  "demangle",
  "runtime",
  "cranelift",
  "component-model",
  "incremental-cache",
  "parallel-compilation",
] }
wasmtime-wasi = "29"
wasmparser = "0.222"
semver = "1.0"

# Auth
grok-auth = { path = "../grok-auth" }
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
rand = "0.8"
ed25519-dalek = "2.1"

# Configuration
dirs = "6.0"

# URL/Web
url = "2.5"
tiny_http = "0.12"
httpdate = "1.0"
netstat2 = "0.11"

# Utilities
which = "7.0"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.10.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
regex = "1.11"
once_cell = "1.20"
glob = "0.3"
globset = "0.4"
walkdir = "2.5"
similar = "2.4"
shell-words = "1.1"
scopeguard = "1.2"
bytes = "1.10"

# Archive handling (for Zed extensions)
flate2 = "1.0"
tar = "0.4"
zip = "2.2"
xz2 = "0.1"

# Concurrency
dashmap = "6.1"
parking_lot = "0.12"
moka = { version = "0.12", features = ["sync"] }

# File System
ignore = "0.4"
fs2 = "0.4"
cap-std = "3.4.5"
cap-fs-ext = "3.4.5"

# Agent Client Protocol (ACP)
agent-client-protocol = { version = "0.9", features = [
  "unstable_session_model",
] }

# Model Context Protocol (MCP) - official Rust SDK
rmcp = { version = "1.3", default-features = false, features = [
  "client",
  "transport-child-process",
  "transport-streamable-http-client",
  "client-side-sse",
  "auth",
  "elicitation",
] }
# Required by our StreamableHttpClient trait impl (same versions rmcp uses)
http = "1"
sse-stream = "0.2"

# Version Control (vendored for cross-compilation)
git2 = { version = "0.19", features = ["vendored-libgit2", "vendored-openssl"] }

# System
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3.14"

[lints]
workspace = true
