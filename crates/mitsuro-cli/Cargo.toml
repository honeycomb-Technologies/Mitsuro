[package]
name = "mitsuro"
version = "0.10.1"
publish = false
edition = "2021"
description = "Mitsuro AI coding runtime and compatibility CLI"
default-run = "mitsuro"

[dependencies]
# Core library
mitsuro-core = { path = "../mitsuro-core" }
mitsuro-server = { path = "../mitsuro-server" }

# Async Runtime
tokio = { version = "1.40", features = ["full"] }

# Error Handling
anyhow = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async Utilities
futures = "0.3"
tokio-stream = "0.1"

# HTTP
reqwest = { version = "0.12", features = ["json", "stream"] }

# Terminal UI
ratatui = "0.29"
ratatui-image = "4"
crossterm = { version = "0.28", features = ["event-stream"] }
unicode-width = "0.2"
arboard = "3"
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
] }

# Configuration
dirs = "6.0"

# URL/Web
url = "2.5"
webbrowser = "1.0"

# Utilities
uuid = { version = "1.11", features = ["v4", "serde"] }
regex = "1.11"
once_cell = "1.20"
clap = { version = "4.5", features = ["derive"] }
similar = "2.4"

# Concurrency
parking_lot = "0.12"

# File System
ignore = "0.4"

# Markdown
pulldown-cmark = "0.13.0"

# Syntax Highlighting
syntect = { version = "5.2", default-features = false, features = [
  "default-fancy",
] }

[dev-dependencies]
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3.14"

[[bin]]
name = "mitsuro"
path = "src/main.rs"

[[bin]]
name = "krusty"
path = "src/bin/krusty.rs"

[lints]
workspace = true
