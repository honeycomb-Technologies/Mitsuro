[package]
name = "mitsuro-desktop-backend"
version = "0.10.1"
publish = false
edition = "2021"
license = "MIT"
description = "Desktop transport adapters for Codex app-server and the Mitsuro HTTP/SSE API"
readme = "README.md"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
chrono = "0.4"
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.43", features = [
  "fs",
  "io-util",
  "macros",
  "process",
  "rt-multi-thread",
  "sync",
  "time",
] }
tracing = "0.1"
url = "2.5"
mitsuro-client = { path = "../mitsuro-client" }

[dev-dependencies]
tempfile = "3.14"
tokio = { version = "1.43", features = [
  "io-util",
  "macros",
  "process",
  "rt-multi-thread",
  "sync",
  "time",
] }

[lints]
workspace = true
