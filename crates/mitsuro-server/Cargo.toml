[package]
name = "mitsuro-server"
version = "0.10.1"
publish = false
edition = "2021"
description = "Self-hosted Mitsuro API server library"

[dependencies]
mitsuro-core = { path = "../mitsuro-core" }
mitsuro-hive-protocol = { path = "../mitsuro-hive-protocol" }

tokio = { version = "1.40", features = ["full"] }

axum = { version = "0.7", features = ["macros", "ws"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }

anyhow = "1.0"
async-trait = "0.1"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

tokio-stream = "0.1"
futures = "0.3"
fs2 = "0.4"
rusqlite = { version = "0.32", features = ["backup", "bundled"] }

dirs = "6.0"
regex = "1.10"
uuid = { version = "1.11", features = ["v4"] }
rust-embed = { version = "8", features = ["mime-guess"] }
mime_guess = "2"
portable-pty = "0.8"
cap-std = "3.4.5"
cap-fs-ext = "3.4.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Web Push notifications (pure Rust, no OpenSSL — matches rustls stack)
web-push-native = "0.4"
base64ct = { version = "1", features = ["alloc"] }
reqwest = { version = "0.12", default-features = false, features = ["http2", "json", "stream", "rustls-tls"] }

# APNs (Apple Push Notification service) — JWT auth via ES256
jsonwebtoken = "9"
tokio-tungstenite = { version = "0.24", default-features = false, features = ["rustls-tls-webpki-roots", "connect"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
