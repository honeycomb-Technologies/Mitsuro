[package]
name = "mitsuro-canvas"
version = "0.10.1"
publish = false
edition = "2021"
license = "MIT"
description = "Native spatial Code workspace for Mitsuro"
autobins = false

[features]
default = []
component-harness = []
acceptance = []

[dependencies]
alacritty_terminal = "0.25.1"
anyhow = "1.0"
base64 = "0.22"
futures-util = "0.3"
flume = "0.11"
gpui = "0.2.2"
gpui-component = "0.5.1"
http = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
mitsuro-client = { path = "../../../crates/mitsuro-client" }
mitsuro-core = { path = "../../../crates/mitsuro-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "process", "sync", "time"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["rustls-tls-webpki-roots", "connect"] }
toml = "0.8"
uuid = { version = "1.11", features = ["serde", "v4"] }
fs2 = "0.4"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.14"

[lints]
workspace = true

[[bin]]
name = "mitsuro-canvas"
path = "src/main.rs"
